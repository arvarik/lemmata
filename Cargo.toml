[package]
name = "lemma"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Lemma Developers"]
description = "A fast CLI for Laya System 1 decision and classification models"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/arvarik/lemma"
homepage = "https://github.com/arvarik/lemma"
documentation = "https://docs.rs/lemma"
keywords = ["cli", "machine-learning", "decision-models", "routing", "classification"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
walkdir = "2.5"
rayon = "1.10"
anyhow = "1.0"
thiserror = "2.0"
comfy-table = "7.1"
rand = "0.8"

[lib]
name = "lemma"
path = "src/lib.rs"

[[bin]]
name = "lemma"
path = "src/main.rs"

# cargo-binstall configuration for direct binary release downloads
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Optimized release binary profile
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
