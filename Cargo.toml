[package]
name = "lemma"
version = "0.1.0"
edition = "2024"
authors = ["Lemma Developers"]
description = "A fast CLI for Laya System 1 decision and classification models"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
walkdir = "2.5"
rayon = "1.10"
anyhow = "1.0"
thiserror = "2.0"
comfy-table = "7.1"
rand = "0.8"

[lib]
name = "lemma"
path = "src/lib.rs"

[[bin]]
name = "lemma"
path = "src/main.rs"
