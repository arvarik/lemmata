[package]
name = "lemma"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Lemma Developers"]
description = "A fast CLI for Laya System 1 decision and classification models"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/arvarik/lemma"
homepage = "https://github.com/arvarik/lemma"
keywords = ["cli", "machine-learning", "decision-models", "routing", "classification"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
csv = "1.4.0"
rayon = "1.12.0"
anyhow = "1.0.104"
comfy-table = "8.0.1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11.1"
hmac = "0.13.0"

# On macOS, Accelerate runs candle's CPU matrix multiplies, and Metal runs models on the GPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.0", features = ["accelerate", "metal"] }
candle-nn = { version = "0.11.0", features = ["accelerate", "metal"] }
candle-transformers = { version = "0.11.0", features = ["accelerate", "metal"] }

[lib]
name = "lemma"
path = "src/lib.rs"

[[bin]]
name = "lemma"
path = "src/main.rs"

# cargo-binstall configuration for direct binary release downloads
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Optimized release binary profile
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Optimize dependencies in debug builds too: unoptimized candle makes the parity test take minutes.
[profile.dev.package."*"]
opt-level = 3
