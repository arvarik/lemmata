name: Bug Report
description: Report a bug or unexpected behavior in lemma.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues before submitting.
  - type: input
    id: cli-version
    attributes:
      label: Lemma Version
      description: Output of `lemma --version`
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL/Arch/Other)
        - macOS (Apple Silicon / ARM64)
        - macOS (Intel / x86_64)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - Prebuilt binary (curl install.sh)
        - cargo binstall lemma
        - cargo install (built from source)
        - Local git checkout
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact command line run, arguments, and input schema/data.
      placeholder: "lemma classify --data-dir data/ --schema schema/questions.json"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output / Error Log
      description: Full terminal output or panic backtrace (run with `RUST_BACKTRACE=1`).
      render: shell
    validations:
      required: true
