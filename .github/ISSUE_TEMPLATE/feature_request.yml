name: Feature Request
description: Propose a new feature, architecture idea, or CLI improvement for lemma.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Context
      description: Is your feature request related to a problem or limitation?
      placeholder: "When running streaming pipelines with high cardinality schemas..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / CLI Interface
      description: Describe your proposed CLI subcommand, flag, engine module, or behavior.
      placeholder: "lemma stream --lakehouse delta://path --compaction-interval 10m"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
