name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Strictly enforces release title format as vX.X.X
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes

  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux x86_64 (musl static binary)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 (cross-compiled)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-latest
          # macOS Apple Silicon (ARM64)
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and Upload Binary
        id: upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: lemma
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          include: README.md,LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.upload.outputs.tar }}

  publish-ghcr-package:
    name: Publish GHCR Container Package
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust musl toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static Linux binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push GHCR container image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          cat << 'EOF' > Dockerfile.release
          FROM gcr.io/distroless/static-debian12:nonroot
          COPY target/x86_64-unknown-linux-musl/release/lemma /usr/local/bin/lemma
          ENTRYPOINT ["/usr/local/bin/lemma"]
          EOF
          docker build -f Dockerfile.release -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Attest Container Provenance
        uses: actions/attest@v4
        with:
          subject-path: target/x86_64-unknown-linux-musl/release/lemma
